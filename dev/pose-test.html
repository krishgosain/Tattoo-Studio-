<!doctype html><html><body style="margin:0;background:#222"><div style="width:100vw;height:100vh"><canvas id="c" style="width:100%;height:100%;display:block"></canvas></div>
<script type="module">
import * as THREE from 'three';
import { Stage } from '/src/viewer/stage.js';
const st = new Stage(document.getElementById('c'));
const [meta, buf, bmeta, bbuf] = await Promise.all([fetch('/models/studio.json').then(r=>r.json()), fetch('/models/studio.bin').then(r=>r.arrayBuffer()), fetch('/models/body.json').then(r=>r.json()), fetch('/models/body.bin').then(r=>r.arrayBuffer())]);
const n = meta.vertexCount;
const idx = new Uint16Array(bbuf, n*24, bmeta.bodyIndexCount);
const mk = (off, color) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(buf, off, n*3), 3)); g.setIndex(new THREE.BufferAttribute(idx,1)); g.computeVertexNormals(); const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color, roughness:.6})); m.castShadow=true; st.scene.add(m); return m; };
mk(0, '#c38a5e'); mk(n*12, '#8a5a3a');
const s = new THREE.Mesh(new THREE.SphereGeometry(0.01), new THREE.MeshBasicMaterial({color:'red'})); s.position.fromArray(meta.spot); st.scene.add(s);
window.view = (x,y,z,tx,ty,tz) => { st.controls.target.set(tx,ty,tz); st.camera.position.set(x,y,z); st.controls.update(); };
window.ready = true;
</script></body></html>
