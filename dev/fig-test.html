<!doctype html><html><body style="margin:0;background:#111"><div style="width:100vw;height:100vh"><canvas id="c" style="width:100%;height:100%;display:block"></canvas></div>
<script type="module">
import * as THREE from 'three';
import { Stage } from '/src/viewer/stage.js';
import { loadFigures } from '/src/film/figures.js';
const st = new Stage(document.getElementById('c'));
const f = await loadFigures();
st.scene.add(f.client.group, f.artist.group);
window.view = (x,y,z,tx,ty,tz) => { st.controls.target.set(tx,ty,tz); st.camera.position.set(x,y,z); st.controls.update(); };
window.ready = true;
</script></body></html>
